# One public address for every language's voice backend: the English voice site
# (voice.orchestrator.kagzso.com) also serves Tamil at /ta/, Hindi at /hi/, Kannada at /kn/.
# Each language's PUBLIC_BASE_URL is that same address plus its key, e.g.
#   PUBLIC_BASE_URL=https://voice.orchestrator.kagzso.com/ta      (kagzso-voice-backend-english/.env.ta)
# nginx drops the /ta and passes the rest (Plivo / Twilio webhooks, and the call audio over
# WebSockets) to that language's port. English paths (/api, /ws, /health, /ready, ...) never start
# with /ta/, /hi/ or /kn/, so the English site works exactly as before.
#
# Install once (no new domain, DNS record or certificate): add this one line inside the existing
# `server { ... }` block of the English voice site (the one with `server_name voice.orchestrator.kagzso.com`
# and `listen 443`), next to its other `location` blocks, then reload:
#
#   include /opt/kagzso-automation/deploy/nginx-voice-languages.conf;
#
#   sudo nginx -t && sudo systemctl reload nginx        # reload, never restart: the other sites keep running
#
# The ports are the defaults (VOICE_BACKEND_URL_TA/HI/KN in Dispatch's .env). A language whose backend
# isn't running yet just answers 502 here; nothing else is affected.

location /ta/ {
    proxy_pass http://127.0.0.1:8003/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location /hi/ {
    proxy_pass http://127.0.0.1:8004/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location /kn/ {
    proxy_pass http://127.0.0.1:8005/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
